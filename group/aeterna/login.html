<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Æterna Victrix — Acesso do cliente</title>
<style>
  :root{
    --lime:#88E833; --deep-forest:#0E1C0E; --charcoal:#262626; --mid-green:#2E6F3A;
    --sage:#D5DAD0; --white:#FFFFFF; --alt-row:#152615; --red:#C0392B;
    --line:#1E331E; --panel:#112211; --sage-dim:#9BA695;
    --font:'Zalando Sans SemiExpanded','Segoe UI',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    font-family:var(--font); color:var(--sage); background:var(--deep-forest);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px;
  }
  .card{
    width:100%; max-width:380px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:34px 30px;
  }
  .brand{margin-bottom:26px}
  .wordmark{font-weight:800; letter-spacing:.22em; font-size:16px; color:var(--white); text-transform:uppercase}
  .wordmark .xp{color:var(--lime)}
  .brand small{display:block; font-weight:300; font-size:9.5px; letter-spacing:.16em; color:var(--sage-dim); text-transform:uppercase; margin-top:6px}
  h1{font-size:15px; font-weight:600; color:var(--white); margin:0 0 4px}
  .hint{font-size:12px; color:var(--sage-dim); margin:0 0 22px; line-height:1.5}
  label{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--sage-dim); margin:0 0 6px}
  input{
    width:100%; padding:11px 12px; margin-bottom:16px; font-family:var(--font); font-size:14px;
    color:var(--white); background:#0B160B; border:1px solid var(--line); border-radius:8px;
  }
  input:focus{outline:none; border-color:var(--mid-green)}
  button{
    width:100%; padding:12px; font-family:var(--font); font-weight:700; font-size:13px; letter-spacing:.06em;
    color:var(--deep-forest); background:var(--lime); border:none; border-radius:8px; cursor:pointer;
  }
  button:disabled{opacity:.55; cursor:default}
  .link{background:none; color:var(--sage-dim); font-weight:400; letter-spacing:0; font-size:12px; padding:12px 0 0; text-decoration:underline}
  .msg{font-size:12.5px; margin:14px 0 0; line-height:1.5; min-height:18px}
  .msg.err{color:var(--red)}
  .msg.ok{color:var(--lime)}
  .foot{margin-top:24px; font-size:10.5px; color:var(--sage-dim); line-height:1.6; border-top:1px solid var(--line); padding-top:14px}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <span class="wordmark">ÆTERNA&nbsp;<span class="xp">VICTRIX</span></span>
      <small>Coordenação e Organização Patrimonial</small>
    </div>
    <h1>Acesso ao seu relatório</h1>
    <p class="hint">Área restrita. Informe suas credenciais para visualizar sua carteira.</p>

    <form id="loginForm" autocomplete="on">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="username" placeholder="voce@exemplo.com">
      <label for="senha">Senha</label>
      <input id="senha" type="password" required autocomplete="current-password" placeholder="••••••••">
      <button id="btn" type="submit">Entrar</button>
      <button id="reset" type="button" class="link">Esqueci minha senha</button>
      <p id="msg" class="msg" role="status" aria-live="polite"></p>
    </form>

    <div class="foot">Seus dados organizados e seguros.<br>Victrix Group · Organização Patrimonial.</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="./config.js"></script>
<script>
(function(){
  var CFG = window.VICTRIX_CONFIG||{};
  var msg = document.getElementById('msg');
  var btn = document.getElementById('btn');
  function show(t, kind){ msg.textContent=t; msg.className='msg '+(kind||''); }

  if(!CFG.SUPABASE_URL || !CFG.SUPABASE_ANON_KEY){ show('Configuração ausente (config.js).','err'); return; }
  var sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { storage: window.sessionStorage, persistSession: true, autoRefreshToken: true } });

  // Se já autenticado, vai direto ao relatório
  sb.auth.getSession().then(function(r){ if(r.data.session){ location.replace('./relatorio.html'); } });

  document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();
    btn.disabled=true; show('Entrando…');
    var email=document.getElementById('email').value.trim();
    var senha=document.getElementById('senha').value;
    var r = await sb.auth.signInWithPassword({ email:email, password:senha });
    if(r.error){ show('E-mail ou senha inválidos.','err'); btn.disabled=false; return; }
    location.replace('./relatorio.html');
  });

  document.getElementById('reset').addEventListener('click', async function(){
    var email=document.getElementById('email').value.trim();
    if(!email){ show('Informe seu e-mail para receber o link de redefinição.','err'); return; }
    var r = await sb.auth.resetPasswordForEmail(email, { redirectTo: new URL('./redefinir', location.href).href });
    if(r.error){ console.error('resetPasswordForEmail:', r.error); show('Não foi possível enviar o e-mail agora. ('+(r.error.message||('HTTP '+r.error.status))+')','err'); return; }
    show('Enviamos um link de redefinição para o seu e-mail.','ok');
  });
})();
</script>
</body>
</html>
